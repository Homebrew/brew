# brew tap-new uses this file to generate a PR test workflow for the new tap
name: tap-new tests template

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    if: github.repository == ''
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      # tap-new-github-packages-start
      packages: read
      # tap-new-github-packages-end
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-packages-detect
        id: packages-detect
        if: github.event_name == 'pull_request'
      # tap-new-github-packages-start
      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: steps.packages-detect.outputs.testing_formulae
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"
      # tap-new-github-packages-end
      - run: |
          brew test-bot --only-formulaeTAP_NEW_ROOT_URL_ARGUMENT \
            --testing-formulae="$TESTING_FORMULAE" \
            --added-formulae="$ADDED_FORMULAE" \
            --deleted-formulae="$DELETED_FORMULAE"
        if: steps.packages-detect.outputs.testing_formulae || steps.packages-detect.outputs.deleted_formulae
        env:
          TESTING_FORMULAE: ${{ steps.packages-detect.outputs.testing_formulae }}
          ADDED_FORMULAE: ${{ steps.packages-detect.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ steps.packages-detect.outputs.deleted_formulae }}
          # tap-new-github-packages-start
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}
          # tap-new-github-packages-end

      - run: |
          brew test-bot --only-casks \
            --testing-casks="$TESTING_CASKS" \
            --added-casks="$ADDED_CASKS"
        if: >-
          !cancelled() && steps.packages-detect.outcome == 'success' && steps.packages-detect.outputs.testing_casks != ''
        env:
          TESTING_CASKS: ${{ steps.packages-detect.outputs.testing_casks }}
          ADDED_CASKS: ${{ steps.packages-detect.outputs.added_casks }}

      - name: Upload bottles as artifact
        if: always() && steps.packages-detect.outputs.testing_formulae
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
