# brew tap-new uses this file to generate an autobump workflow for the new tap
name: tap-new autobump template

on:
  push:
    branches:
      - TAP_NEW_BRANCH
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # this will be changed later and randomised by brew tap-new
    - cron: "1 1 1 1 1"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    if: github.repository == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          PR_MESSAGE: >-
            **Do not merge this pull request using GitHub's merge button.**
            Once all checks have passed, run the
            [`brew pr-pull`](${{ github.server_url }}/${{ github.repository }}/actions/workflows/publish.yml)
            workflow with this pull request's number to publish the bottles and integrate the changes.
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME" --message="$PR_MESSAGE"
